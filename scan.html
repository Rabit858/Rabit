<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ラックスキャナー</title>
<style>
  :root { --teal: #0f97ab; --ink: #1f2d3d; --sub: #9aa3ad; --ok: #35e08a; --ng: #ff7b72; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: "Noto Sans JP", -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .cam { position: relative; flex: 1; min-height: 0; background: #000; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame { position: absolute; left: 8%; right: 8%; top: 38%; bottom: 38%; border: 2px solid rgba(255,255,255,.9); border-radius: 10px; box-shadow: 0 0 0 999px rgba(0,0,0,.28); pointer-events: none; transition: border-color .15s; }
  .frame.hit { border-color: var(--ok); box-shadow: 0 0 0 999px rgba(0,0,0,.28), 0 0 24px var(--ok); }
  .frame.ng { border-color: var(--ng); }
  .top { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 14px 10px; display: flex; align-items: center; gap: 10px; background: linear-gradient(rgba(0,0,0,.55), transparent); }
  .top b { font-size: 15px; }
  .top .st { margin-left: auto; font-size: 12px; color: #dfe6ec; text-align: right; }
  .panel { background: #111418; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid #262b31; max-height: 42%; display: flex; flex-direction: column; gap: 8px; }
  .msg { font-size: 13px; color: #c9d2da; min-height: 1.4em; }
  .msg.ng { color: var(--ng); }
  .list { overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: baseline; gap: 10px; padding: 8px 10px; background: #1a1f25; border-radius: 10px; font-size: 14px; }
  .row b { font-size: 18px; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .row .r { margin-left: auto; font-size: 13px; color: #c9d2da; text-align: right; }
  .row .r.ok { color: var(--ok); } .row .r.ng { color: var(--ng); }
  .btns { display: flex; gap: 8px; }
  button { font: inherit; font-size: 14px; font-weight: 700; border: 1px solid #3a424b; background: #1a1f25; color: #fff; border-radius: 10px; padding: 9px 14px; }
  button.main { background: var(--teal); border-color: var(--teal); }
  button:disabled { opacity: .45; }
  .big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 15px; line-height: 1.7; color: #e8edf2; background: #0b0d10; }
  .big b { display: block; font-size: 18px; margin-bottom: 8px; }
  .big[hidden], [hidden] { display: none !important; }
  .tap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); font-size: 18px; font-weight: 700; }
</style>
</head>
<body>
<div class="stage">
  <div class="cam">
    <video id="v" playsinline autoplay muted></video>
    <div class="frame" id="frame"></div>
    <div class="top"><b>ラックスキャナー</b><span class="st" id="st"></span></div>
    <div class="big" id="big" hidden></div>
  </div>
  <div class="panel">
    <div class="msg" id="msg">バーコードを枠に入れてください。番号（数字）だけを読み取り、ポータルの画面へ送ります。画像は端末の中だけで処理します。</div>
    <div class="list" id="list"></div>
    <div class="btns">
      <button type="button" id="torch" hidden>ライト</button>
      <button type="button" id="again" hidden>カメラを起動</button>
      <span style="flex:1"></span>
      <button type="button" class="main" id="close">閉じる</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var video = $('v'), frame = $('frame'), msg = $('msg'), list = $('list'), st = $('st');
  var LAST = {}, stream = null, timer = null, zx = null, detector = null, track = null;
  var hasOpener = !!window.opener;
  if (!hasOpener) { st.textContent = '単独'; msg.textContent = '部署ポータルの「カメラで読む」から開くと、読んだ番号がポータルに送られます。この画面だけでも番号は読めます。'; }
  else st.textContent = 'ポータルと接続中';

  function digits(text) { var m = /\d{5,}/.exec(String(text || '').replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })); return m ? m[0] : ''; }
  function beep() {
    try { var ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)()); var o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 1760; g.gain.value = 0.08; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.08); } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(50); } catch (e) {}
  }
  function row(no) {
    var r = document.createElement('div'); r.className = 'row'; r.setAttribute('data-no', no);
    var b = document.createElement('b'); b.textContent = no; r.appendChild(b);
    var res = document.createElement('span'); res.className = 'r'; res.textContent = hasOpener ? '送信…' : ''; r.appendChild(res);
    list.insertBefore(r, list.firstChild);
    while (list.children.length > 30) list.removeChild(list.lastChild);
    return r;
  }
  var RAW = '';
  function onCode(text) {
    var no = digits(text);
    if (!no) { if (text && text !== RAW) { RAW = text; msg.className = 'msg ng'; msg.textContent = '読めましたが番号（5桁以上の数字）がありません：' + String(text).slice(0, 40); } return; }
    msg.className = 'msg';
    var now = Date.now(); if (LAST[no] && now - LAST[no] < 3000) return; LAST[no] = now;
    frame.classList.add('hit'); setTimeout(function () { frame.classList.remove('hit'); }, 350);
    beep();
    row(no);
    if (hasOpener) { try { window.opener.postMessage({ type: 'rack-scan', order: no }, '*'); } catch (e) {} }
  }
  // ポータルからの結果（「A2 に置きました」など）を該当の行に出す
  window.addEventListener('message', function (e) {
    if (e.source !== window.opener || !e.data || e.data.type !== 'rack-scan-result') return;
    var r = list.querySelector('.row[data-no="' + String(e.data.order).replace(/"/g, '') + '"]');
    if (!r) return;
    var res = r.querySelector('.r'); res.textContent = String(e.data.text || ''); res.className = 'r ' + (e.data.ok ? 'ok' : 'ng');
    if (!e.data.ok) { frame.classList.add('ng'); setTimeout(function () { frame.classList.remove('ng'); }, 500); }
  });

  function lib() {
    if (window.ZXing) return Promise.resolve(window.ZXing);
    return new Promise(function (ok, ng) {
      var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
      s.onload = function () { ok(window.ZXing); }; s.onerror = function () { ng(new Error('lib')); };
      document.head.appendChild(s);
    });
  }
  function stop() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (zx) { try { zx.reset(); } catch (e) {} zx = null; }
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  }
  function start() {
    $('big').hidden = true; $('again').hidden = true;
    st.textContent = (hasOpener ? 'ポータルと接続中・' : '') + 'カメラ許可待ち';
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { fail('このブラウザではカメラを使えません（' + location.protocol + '）。'); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }).then(function (s) {
      stream = s; video.srcObject = s; track = s.getVideoTracks()[0];
      try { track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {}); } catch (e) {}
      st.textContent = (hasOpener ? 'ポータルと接続中・' : '') + 'カメラ起動';
      try { var cap = track.getCapabilities ? track.getCapabilities() : {}; if (cap.torch) $('torch').hidden = false; } catch (e) {}
      video.onloadedmetadata = function () { st.textContent = (hasOpener ? 'ポータルと接続中・' : '') + video.videoWidth + '×' + video.videoHeight + (window.BarcodeDetector ? '' : '・ZXing'); };
      return video.play().catch(function () {
        // 自動再生が止められたときは、タップで始める
        return new Promise(function (ok) { var t = document.createElement('div'); t.className = 'tap'; t.textContent = 'タップしてカメラを開始'; t.onclick = function () { t.remove(); video.play().then(ok, ok); }; $('frame').parentNode.appendChild(t); });
      });
    }).then(function () {
      if (!stream) return;
      var useZx = function (why) {
        if (timer) { clearTimeout(timer); timer = null; }
        st.textContent = (hasOpener ? 'ポータルと接続中・' : '') + video.videoWidth + '×' + video.videoHeight + '・ZXing' + (why ? '（' + why + '）' : '');
        lib().then(function (Z) {
          var hints = new Map();
          try { hints.set(Z.DecodeHintType.TRY_HARDER, true); } catch (e) {}
          zx = new Z.BrowserMultiFormatReader(hints, 120);
          zx.decodeFromStream(stream, video, function (res) { if (res && res.getText) onCode(res.getText()); });
        }).catch(function () { fail('読み取り用の部品を読み込めませんでした。通信を確認して、もう一度開いてください。'); });
      };
      if (window.BarcodeDetector) {
        // 内蔵の読み取り（Android の Chrome）。形式はすべて。うまく動かない端末は ZXing に切り替える
        var fails = 0, ticks = 0, hit = false;
        var mk = function () { return BarcodeDetector.getSupportedFormats ? BarcodeDetector.getSupportedFormats().then(function (f) { return new BarcodeDetector(f && f.length ? { formats: f } : undefined); }) : Promise.resolve(new BarcodeDetector()); };
        mk().then(function (d) {
          detector = d;
          var busy = false;
          var tick = function () {
            if (!stream || zx) return;
            if (!busy && video.readyState >= 2) {
              busy = true; ticks++;
              detector.detect(video).then(function (codes) { busy = false; if (codes && codes.length) { hit = true; onCode(codes[0].rawValue); } })
                .catch(function () { busy = false; fails++; if (fails >= 3) { useZx('内蔵が失敗'); } });
            }
            // 内蔵の読み取りが長く何も返さないときも ZXing に切り替える（Play 開発者サービスが無い端末など）
            if (!hit && ticks >= 150 && !zx) { useZx('内蔵で読めず'); return; }
            timer = setTimeout(tick, 120);
          };
          tick();
        }).catch(function () { useZx('内蔵なし'); });
      } else useZx('');
    }).catch(function (e) {
      var name = e && e.name || '';
      fail(name === 'NotAllowedError' ? 'カメラの使用が許可されていません。ブラウザの設定でこのサイトのカメラを許可して、もう一度「カメラを起動」を押してください。' : 'カメラを起動できませんでした（' + (name || 'エラー') + '）。');
    });
  }
  function fail(text) { var b = $('big'); b.hidden = false; b.innerHTML = ''; var t = document.createElement('div'); var h = document.createElement('b'); h.textContent = 'カメラを使えません'; t.appendChild(h); t.appendChild(document.createTextNode(text)); b.appendChild(t); $('again').hidden = false; }

  $('again').addEventListener('click', start);
  $('close').addEventListener('click', function () { stop(); window.close(); setTimeout(function () { msg.textContent = 'このタブを閉じてポータルに戻ってください。'; }, 300); });
  $('torch').addEventListener('click', function () {
    if (!track) return;
    var on = $('torch').getAttribute('data-on') === '1';
    track.applyConstraints({ advanced: [{ torch: !on }] }).then(function () { $('torch').setAttribute('data-on', on ? '0' : '1'); $('torch').textContent = on ? 'ライト' : 'ライト消す'; }).catch(function () {});
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && !stream) start(); });
  window.addEventListener('pagehide', stop);
  // 画面を消さない（対応端末のみ）
  if (navigator.wakeLock) { try { navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} }
  start();
})();
</script>
</body>
</html>
